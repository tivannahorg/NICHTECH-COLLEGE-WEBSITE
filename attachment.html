<!DOCTYPE html>
<html>

<head>

<title>Attachment Registration - NICHTECH</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#f2f5f9;
padding:20px;

}


.container{

max-width:600px;
margin:auto;

background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 4px 15px rgba(0,0,0,0.1);

}



.header{

background:#0b5e2b;
color:white;
text-align:center;
padding:25px;

}


.header img{

width:80px;
height:80px;
border-radius:50%;
background:white;
padding:5px;

}


.header h2{

margin-top:15px;
font-size:22px;

}



.form-area{

padding:25px;

}


.student-info{

background:#f1f8f3;
padding:15px;
border-left:5px solid #0b5e2b;
border-radius:8px;
margin-bottom:20px;

}


.student-info p{

font-size:16px;
margin:5px;

}



label{

font-weight:bold;
color:#0b5e2b;

}



input, textarea{

width:100%;
padding:14px;
margin:8px 0 15px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;

}



textarea{

height:100px;
resize:none;

}



button{

width:100%;
padding:15px;
background:#0b5e2b;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;

}


button:hover{

background:#08451f;

}



.back{

display:block;
text-align:center;
margin-top:20px;
text-decoration:none;
color:#0b5e2b;
font-weight:bold;

}



#message{

text-align:center;
margin-top:15px;
font-weight:bold;

}



</style>


</head>


<body>


<div class="container">


<div class="header">

<img src="logo.png">

<h2>
NICHTECH TECHNOLOGIES<br>
TRAINING COLLEGE
</h2>

<p>
Industrial Attachment Registration
</p>

</div>




<div class="form-area">



<div class="student-info">

<p><b>Student Name:</b> 
<span id="studentName"></span>
</p>


<p><b>Student Number:</b> 
<span id="studentNumber"></span>
</p>


</div>





<label>Institution / Company Name</label>

<input 
type="text" 
id="company"
placeholder="Enter institution name">





<label>Supervisor Name</label>

<input 
type="text"
id="supervisor"
placeholder="Enter supervisor name">





<label>Supervisor Phone Number</label>

<input 
type="text"
id="phone"
placeholder="Enter phone number">





<label>Attachment Start Date</label>

<input 
type="date"
id="startDate">





<label>Attachment End Date</label>

<input 
type="date"
id="endDate">





<label>Institution Address</label>

<textarea
id="address"
placeholder="Enter institution address">
</textarea>





<button onclick="submitAttachment()">

Submit Attachment Registration

</button>


<p id="message"></p>



<a href="dashboard.html" class="back">
← Back to Dashboard
</a>



</div>


</div>





<script>


// CHECK LOGIN

const student = JSON.parse(localStorage.getItem("studentData"));



if(!student){

window.location.href="portal.html";

}

else{


document.getElementById("studentName").innerText =
student.name || "Not Available";


document.getElementById("studentNumber").innerText =
student.studentId || "Not Available";


}






function submitAttachment(){


const attachment = {

studentName: student.name,

studentNumber: student.studentId,

company: document.getElementById("company").value,

supervisor: document.getElementById("supervisor").value,

phone: document.getElementById("phone").value,

startDate: document.getElementById("startDate").value,

endDate: document.getElementById("endDate").value,

address: document.getElementById("address").value

};



fetch(
"https://script.google.com/macros/s/AKfycbwM5dwST8GJ-1CyWcqP_59FICBw_QPOaNeD_sLSUuZ_fqc8nrQJ_wKhyLH6KWepbuLjpA/exec",
{
    method: "POST",
    body: JSON.stringify(attachment)
})

.then(response => response.text())

.then(result => {


document.getElementById("message").innerHTML =
"✅ Attachment submitted successfully!";


console.log(result);


})


.catch(error=>{


document.getElementById("message").innerHTML =
"❌ Submission failed";


console.log(error);


});


}





// SAVE TEMPORARILY

localStorage.setItem(
"attachmentData",
JSON.stringify(attachment)
);




document.getElementById("message").innerHTML =
"Attachment details submitted successfully!";



console.log(attachment);



}



</script>


</body>


</html>
